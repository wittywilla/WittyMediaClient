# XcodeGen turns this file into WittyMedia.xcodeproj (not committed):
#   brew install xcodegen && cd apple && xcodegen generate
name: WittyMedia
options:
  bundleIdPrefix: com.wittywilla
  deploymentTarget:
    # tvOS 17 runs on every Apple TV HD and 4K, and is what WebRTC (LiveKit's libwebrtc) needs for games.
    iOS: "16.0"
    tvOS: "17.0"
    # Every Apple Vision Pro can run visionOS 2.
    visionOS: "2.0"
  createIntermediateGroups: true
packages:
  WittyKit:
    path: WittyKit
  # libwebrtc, built by LiveKit for every Apple platform (its classes start LKRTC): games over WebRTC.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: 144.7559.15
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: WittyMediaClient
    # Filled in by the owner in Xcode: see docs/OWNER-STEPS.md.
    DEVELOPMENT_TEAM: ""
    # LiveKit's WebRTC has no Intel build for the tvOS or visionOS simulators: Apple silicon only there.
    "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64

targetTemplates:
  App:
    type: application
    scheme: {}
    sources:
      - path: App
      # The themes, wording and test data every client shares.
      - path: ../shared/data
        type: folder
        buildPhase: resources
      # What Profile's Licences page shows: every third-party part and its licence.
      - path: ../NOTICE
        buildPhase: resources
    dependencies:
      - package: WittyKit
      - package: LiveKitWebRTC
    info:
      path: Generated/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: WittyMediaClient
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: WittyMediaClient looks for your WittyMediaServer on your home network.
        # Without this the system refuses the search for servers.
        NSBonjourServices:
          - _wittymedia._tcp
        # Plain HTTP only to local addresses. Everything else needs HTTPS. The app's own check in
        # WittyKit's Address is what refuses a public IP address: this setting doesn't cover those.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

targets:
  # tvOS has no WebView, so this target is native SwiftUI and AVPlayer only. It's the one with a Top Shelf.
  WittyMedia-tvOS:
    templates: [App]
    platform: tvOS
    dependencies:
      - target: WittyMedia-TopShelf
    info:
      path: Generated/Info-WittyMedia-tvOS.plist
      properties:
        # What the Top Shelf opens: see WittyKit's DeepLink.swift. Only this target registers it.
        CFBundleURLTypes:
          - CFBundleURLName: com.wittywilla.wittymediaclient.link
            CFBundleURLSchemes:
              - wittymedia
    entitlements:
      path: Generated/WittyMedia-tvOS.entitlements
      properties:
        # Needs the owner's signing team: see docs/OWNER-STEPS.md. Without it the shelf is just empty.
        com.apple.security.application-groups:
          - group.com.wittywilla.wittymediaclient
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
  WittyMedia-TopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    dependencies:
      - package: WittyKit
    info:
      path: Generated/Info-WittyMedia-TopShelf.plist
      properties:
        CFBundleDisplayName: WittyMediaClient Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: Generated/WittyMedia-TopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wittywilla.wittymediaclient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.topshelf
        TARGETED_DEVICE_FAMILY: "3"
  # iPhone, iPad and Apple Vision Pro. The headset takes the iPad's way of doing everything: the
  # sidebar, the server's pages in a web view, and picture in picture.
  WittyMedia-iOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS, visionOS]
    info:
      path: Generated/Info-WittyMedia-iOS.plist
      properties:
        # Picture in picture needs this. Plain video still pauses when the app goes to the background.
        UIBackgroundModes:
          - audio
        # What the server's pages save goes where the Files app can see it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2,7"
        # Its own visionOS build, so not the iPad one in a window as well.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
