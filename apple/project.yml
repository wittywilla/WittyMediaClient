# XcodeGen turns this file into WittyMedia.xcodeproj (not committed):
#   brew install xcodegen && cd apple && xcodegen generate
name: WittyMedia
options:
  bundleIdPrefix: com.wittywilla
  deploymentTarget:
    # tvOS 17 runs on every Apple TV HD and 4K, and is what WebRTC (LiveKit's libwebrtc) needs for games.
    iOS: "16.0"
    tvOS: "17.0"
    # Every Apple Vision Pro can run visionOS 2.
    visionOS: "2.0"
  createIntermediateGroups: true
packages:
  WittyKit:
    path: WittyKit
  # libwebrtc, built by LiveKit for every Apple platform (its classes start LKRTC): games over WebRTC.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: 144.7559.15
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient
    GENERATE_INFOPLIST_FILE: "YES"
    INFOPLIST_KEY_CFBundleDisplayName: WittyMediaClient
    # Filled in by the owner in Xcode: see docs/OWNER-STEPS.md.
    DEVELOPMENT_TEAM: ""
    # LiveKit's WebRTC has no Intel build for the tvOS or visionOS simulators: Apple silicon only there.
    "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64
    # Wittyconnect, the library that reaches a server from away (peer to peer): built from the server's
    # source by scripts/build-wittyconnect.sh into apple/Frameworks, which isn't committed. It is a static
    # library, so it is linked into the app and nothing is embedded or signed beside it. The app finds it
    # by this path: where the folder is there (Apple TV, iPhone and iPad, and their simulators) the app
    # has the feature, and where it isn't (Apple Vision Pro, or a checkout that hasn't built it) the app
    # builds without. See App/PeerLibrary.swift.
    "FRAMEWORK_SEARCH_PATHS[sdk=appletvos*]": "$(inherited) $(SRCROOT)/Frameworks/Wittyconnect.xcframework/tvos-arm64"
    "FRAMEWORK_SEARCH_PATHS[sdk=appletvsimulator*]": "$(inherited) $(SRCROOT)/Frameworks/Wittyconnect.xcframework/tvos-arm64_x86_64-simulator"
    "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Frameworks/Wittyconnect.xcframework/ios-arm64"
    "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Frameworks/Wittyconnect.xcframework/ios-arm64_x86_64-simulator"

targetTemplates:
  App:
    type: application
    scheme: {}
    sources:
      - path: App
      # The themes, wording and test data every client shares.
      - path: ../shared/data
        type: folder
        buildPhase: resources
      # What Profile's Licences page shows: every third-party part and its licence.
      - path: ../NOTICE
        buildPhase: resources
    dependencies:
      - package: WittyKit
      - package: LiveKitWebRTC
      # Go's own name lookups, inside Wittyconnect, use the system's resolver.
      - sdk: libresolv.tbd
    # The same Licences page shows what is inside Wittyconnect, from the file written beside the library when
    # it is built. Copied by hand, as it is only there when the library is.
    postBuildScripts:
      - name: Wittyconnect's notices
        basedOnDependencyAnalysis: false
        script: |
          notices="${SRCROOT}/Frameworks/THIRD-PARTY-NOTICES.wittyconnect.txt"
          if [ -f "$notices" ]; then
            cp "$notices" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
    info:
      path: Generated/Info-${target_name}.plist
      properties:
        CFBundleDisplayName: WittyMediaClient
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: WittyMediaClient looks for your WittyMediaServer on your home network.
        # Without this the system refuses the search for servers.
        NSBonjourServices:
          - _wittymedia._tcp
        # Plain HTTP only to local addresses. Everything else needs HTTPS. The app's own check in
        # WittyKit's Address is what refuses a public IP address: this setting doesn't cover those.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

targets:
  # tvOS has no WebView, so this target is native SwiftUI and AVPlayer only. It's the one with a Top Shelf.
  WittyMedia-tvOS:
    templates: [App]
    platform: tvOS
    scheme:
      testTargets: [WittyMedia-tvOS-UITests]
    dependencies:
      - target: WittyMedia-TopShelf
    info:
      path: Generated/Info-WittyMedia-tvOS.plist
      properties:
        # What the Top Shelf opens: see WittyKit's DeepLink.swift. Only this target registers it.
        CFBundleURLTypes:
          - CFBundleURLName: com.wittywilla.wittymediaclient.link
            CFBundleURLSchemes:
              - wittymedia
    entitlements:
      path: Generated/WittyMedia-tvOS.entitlements
      properties:
        # Needs the owner's signing team: see docs/OWNER-STEPS.md. Without it the shelf is just empty.
        com.apple.security.application-groups:
          - group.com.wittywilla.wittymediaclient
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
  WittyMedia-TopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    dependencies:
      - package: WittyKit
    info:
      path: Generated/Info-WittyMedia-TopShelf.plist
      properties:
        CFBundleDisplayName: WittyMediaClient Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: Generated/WittyMedia-TopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wittywilla.wittymediaclient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.topshelf
        TARGETED_DEVICE_FAMILY: "3"
  # The Apple TV app run in a simulator against a real server, from away: scripts/p2p-check.sh. It isn't
  # part of the app, and nothing here is built when the app is archived.
  WittyMedia-tvOS-Checks:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Checks
    dependencies:
      - target: WittyMedia-tvOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.checks
        TEST_TARGET_NAME: WittyMedia-tvOS
        TARGETED_DEVICE_FAMILY: "3"
  # The same check on an iPhone simulator: scripts/p2p-check.sh ios.
  WittyMedia-iOS-Checks:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Checks
    dependencies:
      - target: WittyMedia-iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.checks
        TEST_TARGET_NAME: WittyMedia-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
  # iPhone, iPad and Apple Vision Pro. The headset takes the iPad's way of doing everything: the
  # sidebar, the server's pages in a web view, and picture in picture.
  WittyMedia-iOS:
    templates: [App]
    platform: iOS
    supportedDestinations: [iOS, visionOS]
    scheme:
      testTargets: [WittyMedia-iOS-UITests]
    sources:
      # The launch screen's colour: the default theme's background, so opening the app doesn't flash white.
      - path: Launch
    info:
      path: Generated/Info-WittyMedia-iOS.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Picture in picture needs this. Plain video still pauses when the app goes to the background.
        UIBackgroundModes:
          - audio
        # What the server's pages save goes where the Files app can see it.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # You → Sign in a TV scans the code on the other device's screen. Typing the code works without it.
        NSCameraUsageDescription: WittyMediaClient uses the camera to scan the sign-in code shown on a TV or another device.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2,7"
        # Its own visionOS build, so not the iPad one in a window as well.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        # No app icon has been made yet; without this the asset catalog above would ask for one.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  # The apps driven as a person would, on a simulator, against a server the tests are told about: see
  # apple/UITests/Support.swift. They sign nothing, and skip themselves when no server is named.
  WittyMedia-iOS-UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WittyMedia-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: WittyMedia-iOS
        TARGETED_DEVICE_FAMILY: "1,2"
  WittyMedia-tvOS-UITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: UITests
    dependencies:
      - target: WittyMedia-tvOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wittywilla.wittymediaclient.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: WittyMedia-tvOS
        TARGETED_DEVICE_FAMILY: "3"
schemes:
  # Only for scripts/p2p-check.sh. The apps' own schemes are made from their targets.
  WittyMedia-tvOS-Checks:
    build:
      targets:
        WittyMedia-tvOS: all
        WittyMedia-tvOS-Checks: [test]
    test:
      config: Debug
      targets:
        - WittyMedia-tvOS-Checks
  WittyMedia-iOS-Checks:
    build:
      targets:
        WittyMedia-iOS: all
        WittyMedia-iOS-Checks: [test]
    test:
      config: Debug
      targets:
        - WittyMedia-iOS-Checks
