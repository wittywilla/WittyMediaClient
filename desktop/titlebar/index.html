<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'">
  <title>WittyMediaClient</title>
  <link rel="stylesheet" href="titlebar.css">
</head>
<body>
  <div class="title" id="title">WittyMediaClient</div>
  <div class="tools" role="toolbar" aria-label="Window" aria-orientation="horizontal">
    <button type="button" id="help" aria-haspopup="menu">Help</button>
    <button type="button" id="change" hidden>Change server</button>
    <button type="button" id="minimize" class="ctl" aria-label="Minimize" title="Minimize">
      <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M0 5h10v1H0z"/></svg>
    </button>
    <button type="button" id="maximize" class="ctl" aria-label="Maximize" title="Maximize">
      <svg class="when-normal" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M0 0h10v10H0zm1 1v8h8V1z" fill-rule="evenodd"/></svg>
      <svg class="when-maximized" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M2 0h8v8H8v2H0V2h2zm1 1v1h5v5h1V1zM1 3v6h6V3z" fill-rule="evenodd"/></svg>
    </button>
    <button type="button" id="close" class="ctl close" aria-label="Close" title="Close">
      <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M.7 0 5 4.3 9.3 0l.7.7L5.7 5 10 9.3l-.7.7L5 5.7.7 10 0 9.3 4.3 5 0 .7z"/></svg>
    </button>
  </div>
  <script src="titlebar.js"></script>
</body>
</html>
