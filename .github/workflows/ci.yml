name: ci
# Builds the WittyMediaClient apps. No secrets are used: every build here is
# unsigned, or signed with a throwaway debug key, and is only for testing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request replaces that pull request's older runs, queued or running, so
# the build machines aren't kept busy with commits nobody will merge. Every other run (a push to the
# main branch, a schedule, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Commits from Windows lose the executable bit, and a release can't run what's left.
      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s -z | while IFS=$'\t' read -r -d '' info f; do
            case "$f" in *.sh) ;; *) head -c2 "$f" 2>/dev/null | grep -qa '^#!' || continue ;; esac
            [ "${info%% *}" = 100755 ] || echo "$f"
          done)
          [ -z "$bad" ] || { echo "Not executable in git. Run git update-index --chmod=+x on:"; echo "$bad"; exit 1; }
      # A button that is only an icon needs a name TalkBack and VoiceOver can say.
      - name: Every button has a name a screen reader can say
        run: python3 scripts/check-button-names.py

  # The connect screen every app shows first, in Chromium at the sizes people use, desktop and TV: one card, centred
  # both ways, a logo and a name at its top, and no scrolling at 720 pixels tall or more (WittyMediaServer's
  # docs/DESIGN.md, "Standalone pages").
  connect-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        working-directory: shared/connect/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: One centred card with a logo and a name, no scrolling
        working-directory: shared/connect/e2e
        run: npx playwright test

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: linux
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          # The server's branch of the same name as this release branch (v0.8.0-alpha), else its default.
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
          sparse-checkout: |
            themes
            pkg/sdui/data
      - name: Theme data is up to date
        env:
          WMS_THEMES: .server/themes
        run: node shared/scripts/build-themes.mjs --check
      - name: Settings menu is the server's
        env:
          WMS_SDUI_DATA: .server/pkg/sdui/data
        run: node shared/scripts/sync-settings-menu.mjs --check
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        working-directory: desktop
        run: npm test
      # The app itself against a stand-in server: the screens, the sign-in, what a page can't do, and
      # playing on with the window out of sight. Linux has no screen here, so it gets a virtual one, and
      # Ubuntu only lets Chromium's sandbox start from its setuid helper.
      - name: Test the running app
        working-directory: desktop
        shell: bash
        run: |
          node node_modules/electron/install.js
          if [ "$RUNNER_OS" = Linux ]; then
            sudo chown root:root node_modules/electron/dist/chrome-sandbox
            sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
            xvfb-run -a npm run test:app
          else
            npm run test:app
          fi
      - name: Package (unpacked, unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run sync && npx electron-builder ${{ matrix.target }} --dir
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymediaclient-desktop-${{ matrix.artifact }}
          path: |
            desktop/out/*-unpacked
            desktop/out/mac*
          retention-days: 7

  # Electron publishes nothing for FreeBSD, so this builds the package there, in a free
  # virtual machine on GitHub's Linux runners. The package holds only the app: docs/PORTING.md.
  desktop-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wittyconnect for FreeBSD, cross-built here from the server's source into desktop/bin; the VM gets this
      # folder, and package:freebsd refuses to make a package without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect for FreeBSD
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: node scripts/build-wittyconnect.mjs freebsd-x64
      - name: Test and package on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A FreeBSD release installs from the quarterly packages, and so does this: the image
          # comes set to latest, whose Electron for amd64 can be missing for weeks while it builds,
          # and a package depending on an Electron people's systems don't have couldn't be installed.
          # On FreeBSD 15 the packages are FreeBSD-ports; FreeBSD is the base system.
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            pkg update -f
            pkg -vv | grep -A2 'FreeBSD-ports:' || true
            pkg install -y node22 npm-node22
          run: |
            set -e
            cd desktop
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
            npm run package:freebsd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymediaclient-desktop-freebsd
          path: desktop/out/*.pkg
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.8.2
      # The server's SDUI conformance fixtures, which the Android unit tests lay out one by one
      # (android/app/build.gradle.kts reads them from .server). They are the server's, so they are read from its
      # repository and not kept here. Until the server's main branch has them, the test is skipped, and says so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          # The server's branch of the same name as this release branch (v0.8.0-alpha), else its default.
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
      # Wittyconnect, which reaches a server from away (peer to peer), is built from the server's source with
      # gomobile into android/app/libs; the build then requires it (-Pp2p=required), so no APK leaves without it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Android NDK for the peer-to-peer library
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        run: bash android/scripts/build-wittyconnect.sh
      - name: Test and build
        working-directory: android
        run: |
          fixtures=
          if [ -f ../.server/pkg/sdui/conformance/fixtures/index.json ]; then
            fixtures=-PsduiFixturesRequired
          else
            echo "::warning title=SDUI conformance::The server's checkout has no pkg/sdui/conformance, so the conformance test was skipped"
          fi
          gradle --no-daemon testDebugUnitTest lintSideload assembleSideload -Pp2p=required $fixtures
      - name: Native code for all four processors
        working-directory: android
        run: sh scripts/check-abis.sh app/build/outputs/apk/sideload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymedia-android-sideload
          path: android/app/build/outputs/apk/sideload/*.apk
          retention-days: 7

  # Updates must install over the last release (docs/ANDROID-SIGNING.md). A pull request's build has no release key, so
  # here the versionCode and app ID are checked against the newest release, and an emulator installs the build over
  # itself with adb install -r and checks the app's data is kept and it opens. release.yml does the full check with the key.
  android-update:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wittymedia-android-sideload
          path: new
      - name: Against the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(bash android/scripts/previous-release.sh previous)
          bash android/scripts/check-upgrade.sh --allow-debug-key new ${prev:+previous}
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Reinstall over itself on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SAME_VERSION_OK: 1
          OUT: ${{ runner.temp }}/upgrade-test
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash android/scripts/upgrade-test.sh new/app-x86_64-sideload.apk new/app-x86_64-sideload.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-update-test
          path: ${{ runner.temp }}/upgrade-test
          if-no-files-found: ignore
          retention-days: 7

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared package
        working-directory: apple/WittyKit
        run: swift test
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # Wittyconnect, which reaches a server from away, is built from the server's source: the apps build
      # without it when that isn't to be had, and then can't connect from away. Before the project is
      # generated, which picks up the notices file written beside the library.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          # The server's branch of the same name as this release branch (v0.8.0-alpha), else its default.
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      # Required, as in the release: 0.5.1's apps shipped without it because Go wasn't here.
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        run: bash apple/scripts/build-wittyconnect.sh
      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      # Compile only: nothing is signed, and nothing here can run on a device.
      - name: Build for Apple TV, iPhone and iPad, and Apple Vision Pro
        working-directory: apple
        run: |
          pairs="WittyMedia-tvOS|generic/platform=tvOS WittyMedia-iOS|generic/platform=iOS"
          # The iPhone and iPad target builds for Apple Vision Pro too, where the runner's Xcode has its SDK.
          if xcodebuild -showsdks | grep -q -- '-sdk xros'; then
            pairs="$pairs WittyMedia-iOS|generic/platform=visionOS"
          else
            echo "::notice title=visionOS::This runner's Xcode has no visionOS SDK, so Apple Vision Pro wasn't built"
          fi
          for pair in $pairs; do
            scheme=${pair%|*}
            destination=${pair#*|}
            platform=${destination#generic/platform=}
            echo "== $scheme for $platform"
            if ! xcodebuild -project WittyMedia.xcodeproj -scheme "$scheme" -destination "$destination" \
              -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet > "$RUNNER_TEMP/$scheme-$platform.log" 2>&1; then
              tail -60 "$RUNNER_TEMP/$scheme-$platform.log"
              # Annotations can be read without signing in; the log can't.
              grep -E 'error:' "$RUNNER_TEMP/$scheme-$platform.log" | sort -u | head -10 | while IFS= read -r line; do
                echo "::error title=$scheme ($platform)::${line##*/}"
              done
              exit 1
            fi
          done
