name: ci
# Builds the WittyMediaClient apps. No secrets are used: every build here is
# unsigned, or signed with a throwaway debug key, and is only for testing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Commits from Windows lose the executable bit, and a release can't run what's left.
      - name: Scripts are executable in git
        run: |
          bad=$(git ls-files -s -z | while IFS=$'\t' read -r -d '' info f; do
            case "$f" in *.sh) ;; *) head -c2 "$f" 2>/dev/null | grep -qa '^#!' || continue ;; esac
            [ "${info%% *}" = 100755 ] || echo "$f"
          done)
          [ -z "$bad" ] || { echo "Not executable in git. Run git update-index --chmod=+x on:"; echo "$bad"; exit 1; }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
            artifact: linux
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
          sparse-checkout: themes
      - name: Theme data is up to date
        env:
          WMS_THEMES: .server/themes
        run: node shared/scripts/build-themes.mjs --check
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test
        working-directory: desktop
        run: npm test
      - name: Package (unpacked, unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run sync && npx electron-builder ${{ matrix.target }} --dir
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymediaclient-desktop-${{ matrix.artifact }}
          path: |
            desktop/out/*-unpacked
            desktop/out/mac*
          retention-days: 7

  # Electron publishes nothing for FreeBSD, so this builds the package there, in a free
  # virtual machine on GitHub's Linux runners. The package holds only the app: docs/PORTING.md.
  desktop-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test and package on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A FreeBSD release installs from the quarterly packages, and so does this: the image
          # comes set to latest, whose Electron for amd64 can be missing for weeks while it builds.
          # On FreeBSD 15 the packages are FreeBSD-ports; FreeBSD is the base system.
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            pkg update -f
            pkg install -y node22 npm-node22
          run: |
            set -e
            cd desktop
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
            npm run package:freebsd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymediaclient-desktop-freebsd
          path: desktop/out/*.pkg
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          gradle-version: 9.8.2
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintSideload assembleSideload
      - name: Native code for all four processors
        working-directory: android
        run: sh scripts/check-abis.sh app/build/outputs/apk/sideload/app-sideload.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wittymedia-android-sideload
          path: android/app/build/outputs/apk/sideload/*.apk
          retention-days: 7

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the shared package
        working-directory: apple/WittyKit
        run: swift test
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      # Compile only: nothing is signed, and nothing here can run on a device.
      - name: Build for Apple TV, iPhone and iPad, and Apple Vision Pro
        working-directory: apple
        run: |
          pairs="WittyMedia-tvOS|generic/platform=tvOS WittyMedia-iOS|generic/platform=iOS"
          # The iPhone and iPad target builds for Apple Vision Pro too, where the runner's Xcode has its SDK.
          if xcodebuild -showsdks | grep -q -- '-sdk xros'; then
            pairs="$pairs WittyMedia-iOS|generic/platform=visionOS"
          else
            echo "::notice title=visionOS::This runner's Xcode has no visionOS SDK, so Apple Vision Pro wasn't built"
          fi
          for pair in $pairs; do
            scheme=${pair%|*}
            destination=${pair#*|}
            platform=${destination#generic/platform=}
            echo "== $scheme for $platform"
            if ! xcodebuild -project WittyMedia.xcodeproj -scheme "$scheme" -destination "$destination" \
              -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet > "$RUNNER_TEMP/$scheme-$platform.log" 2>&1; then
              tail -60 "$RUNNER_TEMP/$scheme-$platform.log"
              # Annotations can be read without signing in; the log can't.
              grep -E 'error:' "$RUNNER_TEMP/$scheme-$platform.log" | sort -u | head -10 | while IFS= read -r line; do
                echo "::error title=$scheme ($platform)::${line##*/}"
              done
              exit 1
            fi
          done
