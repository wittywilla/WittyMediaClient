# Builds every WittyMediaClient app on every push and pull request, and keeps what it built for a week.
#
# Nothing here is signed with a real certificate, notarized, or published. No secrets are read.
#
#   Windows, macOS, Linux (AppImage), Debian (.deb), Fedora (.rpm), Arch (.pacman)   desktop
#   Flatpak, Snap                                                                    desktop-sandboxed
#   FreeBSD                                                                          desktop-freebsd
#   Plasma Bigscreen                    the Linux packages: desktop checks the launcher entry it lists
#   Android phones and Android TV       android: the same APKs serve both
#   iPhone and iPad, Apple TV           apple
#
# The iOS and tvOS results are "AltStore-style" IPAs. An .ipa is only a zip whose top folder is
# Payload/<App>.app. AltStore, SideStore and Sideloadly take an unsigned IPA like that and sign it
# themselves on install, with the user's own Apple ID, so no provisioning profile, _CodeSignature or
# SwiftSupport folder needs to be in it. The archive is made with code signing switched off and the
# Payload is zipped by hand: xcodebuild -exportArchive isn't used, because it insists on signing.
# apple/scripts/package-ipas.sh does it, here and in the release.
#
# What the release workflow signs and publishes is the owner's job: docs/OWNER-STEPS.md.
name: build

on:
  push:
    branches: [v0.8.0-alpha, master, main]
  pull_request:
  workflow_dispatch:

permissions: {}

# A newer commit on a pull request replaces that pull request's older runs, queued or running. Every
# other run (a push to a branch, one started by hand) has a group of its own and always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  JAVA_VERSION: 17
  GRADLE_VERSION: 9.8.2
  XCODEGEN_VERSION: 2.46.0
  SWIFT_VERSION: '6.1'

jobs:
  # The shared assets (connect screen, wording) and the desktop unit tests. sync-shared.mjs only writes
  # into desktop/connect, which each package script regenerates itself, so nothing is uploaded from here.
  shared:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sync the shared assets
        working-directory: desktop
        run: npm run sync
      - name: Unit tests
        working-directory: desktop
        run: npm test

  # Electron, packaged by electron-builder into installers for each system. Unsigned everywhere: on macOS
  # package.json sets identity "-", which is ad-hoc signing and needs no certificate; publish is null.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: 'package:linux', artifact: linux }
          - { os: windows-latest, script: 'package:win', artifact: windows }
          - { os: macos-latest, script: 'package:mac', artifact: macos }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The tools that make the .rpm and .pacman
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Wittyconnect, the helper that reaches a server from away (desktop/p2p.js), is built from the server's
      # source into desktop/bin, where electron-builder picks it up. Required: no package leaves without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect from the server's source
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: |
          case "$RUNNER_OS" in
            Windows) node scripts/build-wittyconnect.mjs win-x64 ;;
            macOS) node scripts/build-wittyconnect.mjs mac-arm64 && node scripts/build-wittyconnect.mjs mac-x64 ;;
            *) node scripts/build-wittyconnect.mjs linux-x64 ;;
          esac
      - name: Sync the shared assets
        working-directory: desktop
        run: npm run sync
      - name: Package (unsigned)
        working-directory: desktop
        env:
          # No certificate lookup on macOS or Windows; CSC_LINK and CSC_KEY_PASSWORD are deliberately unset.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }}
      - name: What was built
        run: ls -la desktop/out
      - name: The connection helper is in every package
        run: bash scripts/test/helper-packaged.sh desktop/out
      # Plasma Bigscreen has no package of its own: it lists the Linux one, which opens as a TV app there.
      - name: Plasma Bigscreen lists the package's launcher entry
        if: runner.os == 'Linux'
        run: bash scripts/test/bigscreen-entry.sh desktop/out/wittymediaclient-*-linux-amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-desktop-${{ matrix.artifact }}
          path: |
            desktop/out/*.exe
            desktop/out/*.msi
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/*.rpm
            desktop/out/*.pacman
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error
          retention-days: 7

  # The same app as a Flatpak and as a Snap, each made by electron-builder from the configuration in
  # desktop/package.json (its flatpak and snapcraft sections), so they hold what the other packages hold.
  # They are jobs of their own because each needs its own tools, and so one failing leaves the others.
  #
  # Flatpak: flatpak-builder puts the app on Flathub's Electron base (which brings zypak, so Chromium's
  # sandbox works inside Flatpak's), against the freedesktop runtime. The result is a one-file bundle.
  # Snap: snapcraft builds a core24 snap in an LXD container. It is strictly confined; Chromium's own
  # sandbox is off inside it, as the Snap Store only lets browsers keep theirs.
  desktop-sandboxed:
    strategy:
      fail-fast: false
      matrix:
        format: [flatpak, snap]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The runtime, SDK and base named in desktop/package.json's flatpak section, from Flathub, for this
      # user only. electron-builder would fetch them itself, but only from a remote that is already set up.
      - name: The tools that make the Flatpak
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
          # flatpak-builder's sandbox needs user namespaces, which Ubuntu 24.04 refuses a program
          # it has no profile for. This machine is thrown away after the job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          version=$(node -p "require('./desktop/package.json').build.flatpak.runtimeVersion")
          base=$(node -p "require('./desktop/package.json').build.flatpak.baseVersion")
          flatpak install --user --noninteractive -y flathub \
            "org.freedesktop.Platform//$version" "org.freedesktop.Sdk//$version" "org.electronjs.Electron2.BaseApp//$base"
      # Docker's firewall rules on the runner stop LXD's containers reaching the network, hence FORWARD.
      - name: The tools that make the Snap
        if: matrix.format == 'snap'
        run: |
          # The Snap Store sometimes times out: after four tries the snap is skipped, with a
          # warning, so the other packages are still built and checked. SNAP_OK guards the rest.
          for try in 1 2 3 4; do
            if sudo snap install snapcraft --classic && { sudo snap install lxd || sudo snap refresh lxd; }; then
              echo "SNAP_OK=1" >> "$GITHUB_ENV"; break
            fi
            [ "$try" = 4 ] && { echo "::warning::The Snap Store didn't answer: the snap wasn't built"; exit 0; }
            echo "::warning::snap install failed (try $try); trying again in 30s"; sleep 30
          done
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo usermod --append --groups lxd "$USER"
      # sg runs the Snap's build with the lxd group this shell was only just given.
      - name: Package (unsigned)
        if: matrix.format != 'snap' || env.SNAP_OK == '1'
        working-directory: desktop
        env:
          DEBUG: ${{ matrix.format == 'flatpak' && '@malept/flatpak-bundler' || '' }}
        run: |
          if [ "${{ matrix.format }}" = snap ]; then
            # Packaging asks the Snap Store again, for snapd in the build container. When the store is
            # what failed, it's tried again; after three tries the snap is skipped, with a warning, as
            # when the tools couldn't be installed. Any other failure fails the job.
            for try in 1 2 3; do
              set +e
              sg lxd -c "npm run package:snap" 2>&1 | tee "$RUNNER_TEMP/snap.log"
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" = 0 ] && break
              grep -qE 'api\.snapcraft\.io|unable to contact snap store|cannot get nonce from store|store server|Error installing snap' "$RUNNER_TEMP/snap.log" || exit "$status"
              if [ "$try" = 3 ]; then
                echo "::warning::The Snap Store didn't answer while packaging: the snap wasn't built"
                echo "SNAP_OK=0" >> "$GITHUB_ENV"; exit 0
              fi
              echo "::warning::packaging the snap couldn't reach the Snap Store (try $try); trying again in 30s"; sleep 30
            done
          else
            npm run package:flatpak
          fi
      - name: What was built
        if: matrix.format != 'snap' || env.SNAP_OK == '1'
        run: |
          ls -la desktop/out
          file=$(ls desktop/out/wittymediaclient-*-linux-amd64.${{ matrix.format }})
          if [ "${{ matrix.format }}" = snap ]; then
            unsquashfs -d "$RUNNER_TEMP/snap" "$file" meta >/dev/null
            cat "$RUNNER_TEMP/snap/meta/snap.yaml"
            cat "$RUNNER_TEMP"/snap/meta/gui/*.desktop
          else
            flatpak install --user --noninteractive -y --bundle "$file"
            flatpak info --show-permissions com.wittywilla.wittymediaclient
            cat ~/.local/share/flatpak/exports/share/applications/com.wittywilla.wittymediaclient.desktop
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.format != 'snap' || env.SNAP_OK == '1'
        with:
          name: client-desktop-${{ matrix.format }}
          path: desktop/out/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 7

  # Electron publishes nothing for FreeBSD, so this builds the package there, in a virtual machine on
  # GitHub's Linux runner, as ci.yml and the release do. The package holds only the app: docs/PORTING.md.
  desktop-freebsd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wittyconnect for FreeBSD, cross-built here from the server's source into desktop/bin; the VM gets this
      # folder, and package:freebsd refuses to make a package without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect for FreeBSD
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: node scripts/build-wittyconnect.mjs freebsd-x64
      - name: Package on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A FreeBSD release installs from the quarterly packages, and so does this: the image
          # comes set to latest, whose Electron for amd64 can be missing for weeks while it builds.
          # On FreeBSD 15 the packages are FreeBSD-ports; FreeBSD is the base system.
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            pkg update -f
            pkg install -y node22 npm-node22
          run: |
            set -e
            cd desktop
            npm ci --ignore-scripts --no-audit --no-fund
            npm run package:freebsd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-desktop-freebsd
          path: desktop/out/*.pkg
          if-no-files-found: error
          retention-days: 7

  # There is no gradlew wrapper script in android/ (only gradle/wrapper/gradle-wrapper.properties), so
  # Gradle comes from setup-gradle at the version the wrapper properties name, as ci.yml does.
  # "sideload" is release speed signed with the throwaway debug key, so it installs on a device.
  # "release" has no signingConfig and no key is available here, so it comes out as *-release-unsigned.apk.
  # Phones, tablets and Android TV install the same APKs: the one activity is in both the phone launcher
  # and the TV one (LEANBACK_LAUNCHER), with a banner, and neither a touch screen nor leanback is required.
  # There are five of each kind: one for each processor and a universal one.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          # The server's branch of the same name as this release branch (v0.8.0-alpha), else its default.
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
      # Wittyconnect, which reaches a server from away (peer to peer), is built from the server's source with
      # gomobile into android/app/libs; the build then requires it (-Pp2p=required), so no APK leaves without it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Android NDK for the peer-to-peer library
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        run: bash android/scripts/build-wittyconnect.sh
      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build the sideload and (unsigned) release APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleSideload :app:assembleRelease -Pp2p=required
      - name: Native code for all four processors
        working-directory: android
        run: sh scripts/check-abis.sh app/build/outputs/apk/sideload
      - name: What was built
        run: find android/app/build/outputs/apk -name '*.apk' -exec ls -la {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-android
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  # WittyKit, the Swift package the Apple apps share, builds and tests on Linux: its platform-only
  # imports (Network, CryptoKit, FoundationNetworking) are all behind #if canImport.
  wittykit-linux:
    runs-on: ubuntu-latest
    # Swift's own image: setup-swift doesn't support the Ubuntu 26.04 that ubuntu-latest now is.
    # Keep its version with SWIFT_VERSION above (the container can't read env).
    container: swift:6.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: apple/WittyKit
        run: swift build
      - name: Test
        working-directory: apple/WittyKit
        run: swift test

  # iPhone/iPad and Apple TV, archived with signing off and packed into AltStore-style IPAs (see the top of
  # this file). The iOS one is a single file for iPhone and iPad. The tvOS one is the sideload artifact for
  # an Apple TV; AltStore itself installs only to iOS/iPadOS, so on tvOS it needs a tool that can sign and
  # install there (Xcode, or a developer account), and it isn't in the AltStore source.
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; else version="dev-${GITHUB_SHA::8}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"
      - name: Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # Wittyconnect, which reaches a server from away, is built from the server's source: the apps build
      # without it when that isn't to be had, and then can't connect from away. Before the project is
      # generated, which picks up the notices file written beside the library.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          # The server's branch of the same name as this release branch (v0.8.0-alpha), else its default.
          ref: ${{ startsWith(github.base_ref, 'v0.') && github.base_ref || (github.ref_type == 'branch' && startsWith(github.ref_name, 'v0.') && github.ref_name) || '' }}
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        run: bash apple/scripts/build-wittyconnect.sh --if-available
      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      - name: Resolve Swift packages
        working-directory: apple
        run: xcodebuild -resolvePackageDependencies -project WittyMedia.xcodeproj -scheme WittyMedia-iOS -skipPackagePluginValidation -skipMacroValidation
      # Archives both apps with signing off, packs each as Payload/<App>.app, and checks the files: one
      # IPA for iPhone and iPad together, one for Apple TV with its Top Shelf extension.
      - name: Archive and pack the AltStore-style IPAs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash apple/scripts/package-ipas.sh "$VERSION" "$RUNNER_TEMP"
      # The release publishes this as apps.json. Here it only proves the script on a real build: its
      # download address points at a release that doesn't exist.
      - name: Write the AltStore source
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/altstore-source.mjs \
            --ipa "apple/build/wittymediaclient-$VERSION-ios.ipa" --tag "v$VERSION" \
            --info apple/build/ios-Info.json --entitlements apple/build/ios-entitlements.json \
            --project apple/project.yml --out apple/build/apps.json
          cat apple/build/apps.json
      - name: Zip the archives
        working-directory: apple/build
        run: |
          for a in *.xcarchive; do zip -qry "${a%.xcarchive}.xcarchive.zip" "$a"; done
          ls -la ./*.xcarchive.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-apple-ipa
          path: |
            apple/build/*.ipa
            apple/build/apps.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-apple-archives
          path: apple/build/*.xcarchive.zip
          if-no-files-found: warn
          retention-days: 7
      - name: Keep the build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-apple-logs
          path: ${{ runner.temp }}/archive-*.log
          if-no-files-found: ignore
          retention-days: 7

  summary:
    needs: [shared, desktop, desktop-sandboxed, desktop-freebsd, android, wittykit-linux, apple]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    env:
      R_SHARED: ${{ needs.shared.result }}
      R_DESKTOP: ${{ needs.desktop.result }}
      R_SANDBOXED: ${{ needs.desktop-sandboxed.result }}
      R_FREEBSD: ${{ needs.desktop-freebsd.result }}
      R_ANDROID: ${{ needs.android.result }}
      R_WITTYKIT: ${{ needs.wittykit-linux.result }}
      R_APPLE: ${{ needs.apple.result }}
    steps:
      - name: Results
        run: |
          {
            echo "## build"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| shared (sync + unit tests) | $R_SHARED |"
            echo "| desktop (Windows, macOS, AppImage, .deb, .rpm, .pacman; Plasma Bigscreen's launcher entry) | $R_DESKTOP |"
            echo "| desktop-sandboxed (Flatpak, Snap) | $R_SANDBOXED |"
            echo "| desktop-freebsd (.pkg) | $R_FREEBSD |"
            echo "| android (sideload + unsigned release APKs, for phones and Android TV alike) | $R_ANDROID |"
            echo "| wittykit-linux (swift build + test) | $R_WITTYKIT |"
            echo "| apple (iPhone and iPad IPA, Apple TV IPA, AltStore source) | $R_APPLE |"
            echo
            echo "Nothing is signed with a real certificate, notarized, or published. Artifacts are kept for 7 days."
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for r in "$R_SHARED" "$R_DESKTOP" "$R_SANDBOXED" "$R_FREEBSD" "$R_ANDROID" "$R_WITTYKIT" "$R_APPLE"; do
            case "$r" in failure|cancelled) failed=1 ;; esac
          done
          [ "$failed" -eq 0 ] || { echo "::error::A build job failed or was cancelled"; exit 1; }
