# A version tag builds every app and publishes them with a checksum list:
#
#   Windows, macOS, Linux (AppImage), Debian (.deb), Fedora (.rpm), Arch (.pacman)   desktop
#   Flatpak, Snap                                                                    desktop-sandboxed
#   FreeBSD                                                                          desktop-freebsd
#   Plasma Bigscreen                    the Linux packages, which open as a TV app there
#   Android phones and Android TV       android: the same APKs serve both, one for each processor and
#                                       a universal one, signed with the one permanent release key
#   iPhone and iPad, Apple TV           apple: unsigned IPAs for AltStore, SideStore and Sideloadly,
#                                       and apps.json, the source AltStore and SideStore read
#
# The apps aren't installed through a server, so this holds no module key. The one secret it reads is Android's
# release key, in the android-release environment, only in the android job: an update installs over the last only
# when it is signed with the same key (docs/ANDROID-SIGNING.md). Without it the release fails; it never falls back to
# a debug key. android-update then checks the APKs against the previous release, on an emulator too, before anything
# is published. Nothing else is signed with a real certificate: docs/OWNER-STEPS.md.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux }
          - { os: windows-latest, target: --win }
          - { os: macos-latest, target: --mac }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "desktop/package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      # Wittyconnect, the helper that reaches a server from away (desktop/p2p.js), is built from the server's
      # source into desktop/bin, where electron-builder picks it up. Required: no package leaves without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect from the server's source
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: |
          case "$RUNNER_OS" in
            Windows) node scripts/build-wittyconnect.mjs win-x64 ;;
            macOS) node scripts/build-wittyconnect.mjs mac-arm64 && node scripts/build-wittyconnect.mjs mac-x64 ;;
            *) node scripts/build-wittyconnect.mjs linux-x64 ;;
          esac
      - name: The tools that make the .rpm and .pacman
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run sync && npx electron-builder ${{ matrix.target }}
      - name: The connection helper is in every package
        run: bash scripts/test/helper-packaged.sh desktop/out
      # Plasma Bigscreen has no package of its own: it lists the Linux one, which opens as a TV app there.
      - name: Plasma Bigscreen lists the package's launcher entry
        if: runner.os == 'Linux'
        run: bash scripts/test/bigscreen-entry.sh desktop/out/wittymediaclient-*-linux-amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/*.rpm
            desktop/out/*.pacman
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error

  # The same app as a Flatpak and as a Snap, as build.yml makes them on every push: see the notes there.
  desktop-sandboxed:
    strategy:
      fail-fast: false
      matrix:
        format: [flatpak, snap]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "desktop/package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      # Wittyconnect, the helper that reaches a server from away (desktop/p2p.js), is built from the server's
      # source into desktop/bin, where electron-builder picks it up. Required: no package leaves without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect from the server's source
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: |
          case "$RUNNER_OS" in
            Windows) node scripts/build-wittyconnect.mjs win-x64 ;;
            macOS) node scripts/build-wittyconnect.mjs mac-arm64 && node scripts/build-wittyconnect.mjs mac-x64 ;;
            *) node scripts/build-wittyconnect.mjs linux-x64 ;;
          esac
      - name: Install
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: The tools that make the Flatpak
        if: matrix.format == 'flatpak'
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder elfutils
          # flatpak-builder's sandbox needs user namespaces, which Ubuntu 24.04 refuses a program
          # it has no profile for. This machine is thrown away after the job.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          version=$(node -p "require('./desktop/package.json').build.flatpak.runtimeVersion")
          base=$(node -p "require('./desktop/package.json').build.flatpak.baseVersion")
          flatpak install --user --noninteractive -y flathub \
            "org.freedesktop.Platform//$version" "org.freedesktop.Sdk//$version" "org.electronjs.Electron2.BaseApp//$base"
      - name: The tools that make the Snap
        if: matrix.format == 'snap'
        run: |
          # The Snap Store sometimes times out: after four tries the snap is skipped, with a
          # warning, so the other packages are still built and checked. SNAP_OK guards the rest.
          for try in 1 2 3 4; do
            if sudo snap install snapcraft --classic && { sudo snap install lxd || sudo snap refresh lxd; }; then
              echo "SNAP_OK=1" >> "$GITHUB_ENV"; break
            fi
            [ "$try" = 4 ] && { echo "::warning::The Snap Store didn't answer: the snap wasn't built"; exit 0; }
            echo "::warning::snap install failed (try $try); trying again in 30s"; sleep 30
          done
          sudo lxd init --auto
          sudo iptables -P FORWARD ACCEPT
          sudo usermod --append --groups lxd "$USER"
      - name: Package
        if: matrix.format != 'snap' || env.SNAP_OK == '1'
        working-directory: desktop
        env:
          DEBUG: ${{ matrix.format == 'flatpak' && '@malept/flatpak-bundler' || '' }}
        run: |
          if [ "${{ matrix.format }}" = snap ]; then
            # Packaging asks the Snap Store again, for snapd in the build container. When the store is
            # what failed, it's tried again; after three tries the snap is skipped, with a warning, as
            # when the tools couldn't be installed. Any other failure fails the job.
            for try in 1 2 3; do
              set +e
              sg lxd -c "npm run package:snap" 2>&1 | tee "$RUNNER_TEMP/snap.log"
              status=${PIPESTATUS[0]}
              set -e
              [ "$status" = 0 ] && break
              # The build container's own apt can stall on the archive (TimeoutExpired after ten
              # minutes); trying again would run into the job's limit, so the snap is skipped now.
              if grep -q 'TimeoutExpired' "$RUNNER_TEMP/snap.log"; then
                echo "::warning::The snap's build container timed out installing its tools: the snap wasn't built"
                echo "SNAP_OK=0" >> "$GITHUB_ENV"; exit 0
              fi
              grep -qE 'api\.snapcraft\.io|unable to contact snap store|cannot get nonce from store|store server|Error installing snap' "$RUNNER_TEMP/snap.log" || exit "$status"
              if [ "$try" = 3 ]; then
                echo "::warning::The Snap Store didn't answer while packaging: the snap wasn't built"
                echo "SNAP_OK=0" >> "$GITHUB_ENV"; exit 0
              fi
              echo "::warning::packaging the snap couldn't reach the Snap Store (try $try); trying again in 30s"; sleep 30
            done
          else
            npm run package:flatpak
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.format != 'snap' || env.SNAP_OK == '1'
        with:
          name: desktop-${{ matrix.format }}
          path: desktop/out/*.${{ matrix.format }}
          if-no-files-found: error

  desktop-freebsd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Wittyconnect for FreeBSD, cross-built here from the server's source into desktop/bin; the VM gets this
      # folder, and package:freebsd refuses to make a package without it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect for FreeBSD
        working-directory: desktop
        env:
          WITTYMEDIASERVER_SRC: ${{ github.workspace }}/.server
        run: node scripts/build-wittyconnect.mjs freebsd-x64
      - name: Package on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A FreeBSD release installs from the quarterly packages, and so does this: the image
          # comes set to latest, whose Electron for amd64 can be missing for weeks while it builds.
          # On FreeBSD 15 the packages are FreeBSD-ports; FreeBSD is the base system.
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            pkg update -f
            pkg install -y node22 npm-node22
          run: |
            set -e
            cd desktop
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
            npm run package:freebsd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-freebsd
          path: desktop/out/*.pkg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    # Holds ANDROID_RELEASE_KEYSTORE and ANDROID_RELEASE_KEYSTORE_PASSWORD, for version tags only.
    environment: android-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.8.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
      # Wittyconnect, which reaches a server from away (peer to peer), is built from the server's source with
      # gomobile into android/app/libs; the build then requires it (-Pp2p=required), so no APK leaves without it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Android NDK for the peer-to-peer library
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" >/dev/null
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        run: bash android/scripts/build-wittyconnect.sh
      # The release key, from the android-release environment (docs/ANDROID-SIGNING.md). Without it the release stops
      # here: a release signed with any other key would refuse to install over the last one.
      - name: The release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::The android-release environment has no ANDROID_RELEASE_KEYSTORE or ANDROID_RELEASE_KEYSTORE_PASSWORD. Android releases are signed only with the release key: docs/ANDROID-SIGNING.md"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "WMC_ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: android
        env:
          WMC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          WMC_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS || 'wittymediaclient' }}
        run: gradle --no-daemon testDebugUnitTest lintRelease assembleRelease -Pp2p=required -PreleaseSigning=required
      - name: Forget the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Native code for all four processors
        working-directory: android
        run: sh scripts/check-abis.sh app/build/outputs/apk/release
      - name: Name each APK as the release's other files are
        working-directory: android/app/build/outputs/apk/release
        run: |
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            mv "app-$abi-release.apk" "wittymediaclient-${GITHUB_REF_NAME#v}-android-$abi.apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: android/app/build/outputs/apk/release/wittymediaclient-*.apk
          if-no-files-found: error

  # Before anything is published: the new APKs must install over the previous release's as an update. Same app ID,
  # same certificate, higher versionCode (android/scripts/check-upgrade.sh), then an emulator installs the previous
  # release, keeps some state, installs this one over it with adb install -r, and checks the state is kept and it opens
  # (android/scripts/upgrade-test.sh). Releases up to 0.6.0 were signed with throwaway debug keys, which nothing can
  # update: the first release with the release key is let through once, and its notes say to uninstall once.
  android-update:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android
          path: new
      - name: Against the previous release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_NOTE: ${{ runner.temp }}/notes/android.md
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          prev=$(bash android/scripts/previous-release.sh previous "$GITHUB_REF_NAME")
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
          bash android/scripts/check-upgrade.sh new ${prev:+previous}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-notes-android
          path: ${{ runner.temp }}/notes
          if-no-files-found: ignore
      - name: Let the emulator use KVM
        if: steps.check.outputs.same_key == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Update the previous release in place on an emulator
        if: steps.check.outputs.same_key == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          OUT: ${{ runner.temp }}/upgrade-test
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash android/scripts/upgrade-test.sh previous/*-android-x86_64.apk new/*-android-x86_64.apk
      - name: No emulator test this once
        if: steps.check.outputs.same_key != 'true'
        env:
          PREVIOUS: ${{ steps.check.outputs.previous }}
        run: echo "::notice::The previous release (${PREVIOUS:-none}) isn't signed with the release key, so nothing can be updated from it; from the next release on, the emulator updates this one in place"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-update-test
          path: ${{ runner.temp }}/upgrade-test
          if-no-files-found: ignore
          retention-days: 30

  # iPhone and iPad in one IPA, Apple TV in another, both unsigned: AltStore, SideStore or Sideloadly signs
  # on install with the user's own Apple ID. apps.json is the AltStore source for the iOS one, written from
  # the built app and checked against apple/project.yml. Apple TV isn't in it: neither store installs there.
  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      XCODEGEN_VERSION: 2.46.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # An app's version is numbers only, so 0.5.0-beta is 0.5.0 inside the app. AltStore refuses an
      # app whose version isn't the one its source names, and the source takes it from the built app.
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' apple/project.yml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          [ "$want" = "${tag%%-*}" ] || { echo "apple/project.yml says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      # Wittyconnect, which reaches a server from away, is built from the server's source: the apps build
      # without it when that isn't to be had, and then can't connect from away. Before the project is
      # generated, which picks up the notices file written beside the library.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          repository: wittywilla/WittyMediaServer
          path: .server
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: .server/go.mod
          cache: false
      - name: Build Wittyconnect from the server's source
        env:
          WITTYMEDIASERVER_SRC: .server
        # Required: 0.5.1's iPhone and Apple TV apps shipped without it because Go wasn't set up here.
        run: bash apple/scripts/build-wittyconnect.sh
      - name: Generate the Xcode project
        working-directory: apple
        run: xcodegen generate
      - name: Test the shared package
        working-directory: apple/WittyKit
        run: swift test
      - name: Resolve Swift packages
        working-directory: apple
        run: xcodebuild -resolvePackageDependencies -project WittyMedia.xcodeproj -scheme WittyMedia-iOS -skipPackagePluginValidation -skipMacroValidation
      - name: Archive and pack the IPAs
        run: bash apple/scripts/package-ipas.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP"
      - name: Write the AltStore source
        run: |
          node scripts/altstore-source.mjs \
            --ipa "apple/build/wittymediaclient-${GITHUB_REF_NAME#v}-ios.ipa" --tag "$GITHUB_REF_NAME" \
            --info apple/build/ios-Info.json --entitlements apple/build/ios-entitlements.json \
            --project apple/project.yml --out apple/build/apps.json
          cat apple/build/apps.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple
          path: |
            apple/build/*.ipa
            apple/build/apps.json
          if-no-files-found: error
      - name: Keep the build logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-logs
          path: ${{ runner.temp }}/archive-*.log
          if-no-files-found: ignore
          retention-days: 7

  # Publishing runs no project code at all.
  publish:
    needs: [desktop, desktop-sandboxed, desktop-freebsd, android, android-update, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      # android-update's note and pictures aren't release files. Its note (the one release that changes Android's key
      # says to uninstall once) goes at the top of the release notes.
      - name: Set aside what isn't a release file
        run: |
          touch notes.md
          if [ -f release/android.md ]; then cat release/android.md > notes.md; rm release/android.md; fi
          rm -f release/*-opened.png release/failed.png release/archive-*.log
      - name: Write the checksum list
        run: cd release && sha256sum -- * > "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" && mv "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          generate_release_notes: true

  # The website lists releases, but its own schedule can run hours late, so a published release
  # starts its build. That needs SITE_BUILD_TOKEN: a fine-grained token for
  # wittywilla/WittyMediaServer.com only, with Actions read and write and nothing else
  # (docs/OWNER-STEPS.md, "The website, after a release"). Without it this only says so; a failure here never fails the release.
  website:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Rebuild wittymediaserver.com
        env:
          GH_TOKEN: ${{ secrets.SITE_BUILD_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No SITE_BUILD_TOKEN: the website picks this release up on its own schedule"
            exit 0
          fi
          gh workflow run publish.yml -R wittywilla/WittyMediaServer.com --ref main \
            && echo "Started the website's build" \
            || echo "::warning::Couldn't start the website's build; it picks this release up on its own schedule"
