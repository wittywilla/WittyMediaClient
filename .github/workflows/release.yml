# A version tag builds the desktop apps and the Android sideload build, and publishes them with a
# checksum list. The apps aren't installed through a server, so this holds no module key. Signing
# them for each platform is a step for its owner: docs/OWNER-STEPS.md.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux }
          - { os: windows-latest, target: --win }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "desktop/package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run sync && npx electron-builder ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          gradle-version: 9.8.2
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleSideload
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: android/app/build/outputs/apk/sideload/*.apk
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      - name: Write the checksum list
        run: cd release && sha256sum -- * > "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" && mv "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
