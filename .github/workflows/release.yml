# A version tag builds the desktop apps for each system and the Android sideload APKs, one for each processor and a
# universal one, and publishes them with a checksum list. The apps aren't installed through a server, so this holds no
# module key. Signing them for each platform is a step for its owner: docs/OWNER-STEPS.md.
name: release
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: --linux }
          - { os: windows-latest, target: --win }
          - { os: macos-latest, target: --mac }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: The tag must match the version
        run: |
          want="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' desktop/package.json | head -1)"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "desktop/package.json says $want, and the tag is $GITHUB_REF_NAME"; exit 1; }
      - name: The tools that make the .rpm and .pacman
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - name: Package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run sync && npx electron-builder ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/*.deb
            desktop/out/*.rpm
            desktop/out/*.pacman
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error

  desktop-freebsd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Package on FreeBSD
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          # A FreeBSD release installs from the quarterly packages, and so does this: the image
          # comes set to latest, whose Electron for amd64 can be missing for weeks while it builds.
          # On FreeBSD 15 the packages are FreeBSD-ports; FreeBSD is the base system.
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-ports: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/quarterly", mirror_type: "srv" }' > /usr/local/etc/pkg/repos/FreeBSD-ports.conf
            pkg update -f
            pkg install -y node22 npm-node22
          run: |
            set -e
            cd desktop
            npm ci --ignore-scripts --no-audit --no-fund
            npm test
            npm run package:freebsd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-freebsd
          path: desktop/out/*.pkg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          gradle-version: 9.8.2
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintSideload assembleSideload
      - name: Native code for all four processors
        working-directory: android
        run: sh scripts/check-abis.sh app/build/outputs/apk/sideload
      - name: Name each APK as the release's other files are
        working-directory: android/app/build/outputs/apk/sideload
        run: |
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            mv "app-$abi-sideload.apk" "wittymediaclient-${GITHUB_REF_NAME#v}-android-$abi.apk"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: android/app/build/outputs/apk/sideload/wittymediaclient-*.apk
          if-no-files-found: error

  # Publishing runs no project code at all.
  publish:
    needs: [desktop, desktop-freebsd, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release
          merge-multiple: true
      - name: Write the checksum list
        run: cd release && sha256sum -- * > "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" && mv "../WittyMediaClient-${GITHUB_REF_NAME#v}-SHA256SUMS.txt" .
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: release/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
